name: Update movie genres/directors from TMDB

on:
  schedule:
    - cron: "15 6 * * *" # daily at 06:15 UTC, shortly after the movie diary sync
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Look up new films on TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ruby script/update_movie_metadata.rb

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- _data/movie_metadata.yml _data/movie_stats.yml; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/movie_metadata.yml _data/movie_stats.yml
          git commit -m "Update movie genres/directors from TMDB"
          git push
