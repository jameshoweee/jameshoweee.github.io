name: Update movie diary

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours, offset off the hour (GitHub warns top-of-hour schedules are more likely to be delayed/dropped)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest Letterboxd entries and merge into _data/movies.yml
        run: ruby script/update_movies.rb

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- _data/movies.yml; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/movies.yml
          git commit -m "Update movie diary from Letterboxd"
          git push
