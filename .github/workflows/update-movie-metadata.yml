name: Update movie genres/directors from TMDB

on:
  schedule:
    - cron: "32 */6 * * *" # every 6 hours, 15 min after the movie diary sync, offset off the hour
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Look up new films on TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ruby script/update_movie_metadata.rb

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain -- _data/movie_metadata.yml _data/movie_stats.yml)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/movie_metadata.yml _data/movie_stats.yml
          git commit -m "Update movie genres/directors from TMDB"
          git push
